<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Blush and Bloom</title>
  <desc id="desc">Warm salon branding with soft blush tones and elegant typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7efe8"/>
      <stop offset="100%" stop-color="#e8d0d1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf8"/>
      <stop offset="100%" stop-color="#f2dfe1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="80" y="90" width="1040" height="450" rx="32" fill="url(#panel)" opacity="0.92"/>
  <circle cx="260" cy="220" r="140" fill="#d49b9c" opacity="0.18"/>
  <circle cx="930" cy="430" r="175" fill="#b76a72" opacity="0.12"/>
  <text x="160" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#4a2d32" letter-spacing="2">Blush &amp; Bloom</text>
  <text x="160" y="345" font-family="Arial, sans-serif" font-size="28" fill="#6b4e53" letter-spacing="7">HAIR · SKIN · BEAUTY</text>
  <text x="160" y="408" font-family="Arial, sans-serif" font-size="28" fill="#6b4e53">A little time, just for you.</text>
  <rect x="160" y="468" width="180" height="38" rx="19" fill="#b76a72"/>
  <text x="205" y="493" font-family="Arial, sans-serif" font-size="20" fill="#fffaf8" font-weight="700">Book a visit</text>
</svg>
